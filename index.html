<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>令和の虎 モグラ叩き</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      font-size: 1.9rem;
      color: #FFD700;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .hud {
      display: flex;
      gap: 28px;
      margin-bottom: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
    }

    .hud span { color: #FFD700; }

    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #aaa;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend div { display: flex; align-items: center; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-normal  { background: #FFD700; }
    .dot-sneaky  { background: #FF6B35; }
    .dot-rotten  { background: #55cc44; }

    #startBtn {
      padding: 12px 36px;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      color: #1a1a2e;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(255,215,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #startBtn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,215,0,0.6); }
    #startBtn:active { transform: scale(0.97); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,215,0,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .hole {
      width: 105px;
      height: 105px;
      background: #0a0a1a;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.8), 0 0 0 3px #222;
    }

    .mole-wrap {
      position: absolute;
      bottom: -100%;
      left: 0; right: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: bottom 0.15s ease-out;
      pointer-events: none;
      user-select: none;
    }

    .hole.up .mole-wrap { bottom: 0; }

    .mole-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2px solid #FFD700;
      display: block;
    }

    .mole-name {
      font-size: 0.55rem;
      color: #FFD700;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    /* 意地悪モグラ（オレンジ枠） */
    .hole.sneaky .mole-img { border-color: #FF6B35; }
    .hole.sneaky .mole-wrap { transition: bottom 0.07s ease-out; }

    /* 腐ったモグラ（緑フィルター） */
    .hole.rotten .mole-img {
      filter: hue-rotate(90deg) saturate(1.5) brightness(0.9);
      border-color: #55cc44;
    }

    /* 叩いた演出 */
    .hole.bonk .mole-img { filter: brightness(0.3); }
    .hole.bonk::after {
      content: '💥';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      animation: pop 0.35s ease-out forwards;
      z-index: 10;
    }

    .hole.bonk-rotten .mole-img { filter: brightness(0.3); }
    .hole.bonk-rotten::after {
      content: '🤢';
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      animation: pop 0.4s ease-out forwards;
      z-index: 10;
    }

    .hole.dodged::after {
      content: '😏';
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      animation: pop 0.5s ease-out forwards;
      z-index: 10;
    }

    @keyframes pop {
      0%   { opacity: 1; transform: translateX(-50%) scale(0.5); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.3); }
      100% { opacity: 0; transform: translateX(-50%) scale(1); }
    }

    /* フロートスコア */
    .float-score {
      position: fixed;
      font-size: 1.6rem;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 999;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .float-plus  { color: #FFD700; }
    .float-minus { color: #ff4444; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px); }
    }

    #result {
      margin-top: 20px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #FFD700;
      min-height: 2.2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      text-align: center;
    }

    .warn { color: #ff4444 !important; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <h1>🐯 令和の虎 モグラ叩き</h1>

  <div class="hud">
    <div>スコア: <span id="score">0</span></div>
    <div id="timerLabel">残り: <span id="timer">30</span>秒</div>
  </div>

  <div class="legend">
    <div><div class="dot dot-normal"></div> 普通の虎 +1</div>
    <div><div class="dot dot-sneaky"></div> 意地悪な虎（逃げる）</div>
    <div><div class="dot dot-rotten"></div> 腐った虎 -1</div>
  </div>

  <button id="startBtn">ゲームスタート</button>

  <div class="grid" id="grid">
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
    <div class="hole"><div class="mole-wrap"><img class="mole-img" src="" alt=""><div class="mole-name"></div></div></div>
  </div>

  <div id="result"></div>

  <script>
    const TIGERS = [
      { name: "林 尚弘",   img: "imgs/hayashi.webp" },
      { name: "桑田 龍征", img: "imgs/kuwata.webp" },
      { name: "細井ドラゴン", img: "imgs/hosoi.webp" },
      { name: "茂木 哲也", img: "imgs/moteki.webp" },
      { name: "谷本 吉紹", img: "imgs/tanimoto.webp" },
      { name: "高澤 有紀", img: "imgs/takazawa.webp" },
      { name: "遠藤 悠記", img: "imgs/endo.webp" },
      { name: "宮本 聖菜", img: "imgs/sena.webp" },
      { name: "榊原 清一", img: "imgs/sakakibara.webp" },
      { name: "寺田 高士", img: "imgs/terada.webp" },
      { name: "大石 純平", img: "imgs/oishi.webp" },
      { name: "岡田 真弓", img: "imgs/okada.webp" },
      { name: "孫 駿一郎", img: "imgs/son.webp" },
      { name: "竹長 篤史", img: "imgs/takenaga.webp" },
      { name: "荒木 杏奈", img: "imgs/araki.webp" },
      { name: "田中 絢望", img: "imgs/tanaka2.webp" },
      { name: "竹内 亢一", img: "imgs/takeuchi.webp" },
      { name: "小林 真之", img: "imgs/kobayashi.webp" },
      { name: "野口 功司", img: "imgs/noguchi.webp" },
      { name: "安藤 功一郎", img: "imgs/ando.webp" },
      { name: "平出 心",   img: "imgs/hiraide.webp" },
      { name: "南 忠則",   img: "imgs/minami.webp" },
      { name: "神田 みつき", img: "imgs/kanda.webp" },
      { name: "唐沢 菜々江", img: "imgs/nanae.webp" },
      { name: "桐原 隆",   img: "imgs/kirihara.webp" },
      { name: "田中 雄士", img: "imgs/tanaka1.webp" },
      { name: "三浦 哲郎", img: "imgs/miura.webp" },
      { name: "島田 隆史", img: "imgs/shimada.webp" },
      { name: "稲葉 信",   img: "imgs/inaba.webp" },
      { name: "迫 佑樹",   img: "imgs/sako.webp" },
      { name: "関口 ケント", img: "imgs/sekiguchi.webp" },
    ];

    const holes = Array.from(document.querySelectorAll('.hole'));
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const timerLabel = document.getElementById('timerLabel');
    const startBtn = document.getElementById('startBtn');
    const resultEl = document.getElementById('result');

    let score = 0, timeLeft = 30, running = false;
    let moleTimer = null, countdownTimer = null, lastHole = null;

    function randomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      if (holes[idx] === lastHole) return randomHole();
      lastHole = holes[idx];
      return holes[idx];
    }

    function randomTiger() {
      return TIGERS[Math.floor(Math.random() * TIGERS.length)];
    }

    function pickType() {
      const r = Math.random();
      if (r < 0.15) return 'rotten';
      if (r < 0.35) return 'sneaky';
      return 'normal';
    }

    function setHoleTiger(hole, tiger) {
      const img  = hole.querySelector('.mole-img');
      const name = hole.querySelector('.mole-name');
      img.src  = tiger.img;
      img.alt  = tiger.name;
      name.textContent = tiger.name;
    }

    function showMole() {
      if (!running) return;
      const hole  = randomHole();
      const type  = pickType();
      const tiger = randomTiger();

      setHoleTiger(hole, tiger);
      hole.dataset.type = type;
      hole.classList.add('up');
      if (type === 'sneaky') hole.classList.add('sneaky');
      if (type === 'rotten') hole.classList.add('rotten');

      const speed = Math.max(600, 1300 - score * 20);

      if (type === 'sneaky') {
        const dodgeAt = speed * (0.65 + Math.random() * 0.25);
        moleTimer = setTimeout(() => {
          if (!hole.classList.contains('up')) return;
          hole.classList.remove('up', 'sneaky');
          hole.classList.add('dodged');
          setTimeout(() => hole.classList.remove('dodged'), 500);
          setTimeout(showMole, 200);
        }, dodgeAt);
      } else {
        moleTimer = setTimeout(() => {
          hole.classList.remove('up', 'rotten');
          showMole();
        }, speed);
      }
    }

    function floatScore(e, text, cls) {
      const el = document.createElement('div');
      el.className = `float-score ${cls}`;
      el.textContent = text;
      el.style.left = (e.clientX - 20) + 'px';
      el.style.top  = (e.clientY - 30) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function bonk(e) {
      if (!running) return;
      const hole = e.currentTarget;
      if (!hole.classList.contains('up')) return;

      const type = hole.dataset.type || 'normal';
      clearTimeout(moleTimer);
      hole.classList.remove('up', 'sneaky', 'rotten');

      if (type === 'rotten') {
        score = Math.max(0, score - 1);
        scoreEl.textContent = score;
        hole.classList.add('bonk-rotten');
        floatScore(e, '-1', 'float-minus');
        setTimeout(() => { hole.classList.remove('bonk-rotten'); showMole(); }, 400);
      } else {
        score++;
        scoreEl.textContent = score;
        hole.classList.add('bonk');
        floatScore(e, '+1', 'float-plus');
        setTimeout(() => { hole.classList.remove('bonk'); showMole(); }, 300);
      }
    }

    holes.forEach(h => h.addEventListener('click', bonk));

    function startGame() {
      score = 0; timeLeft = 30; running = true;
      scoreEl.textContent = '0';
      timerEl.textContent = '30';
      timerLabel.className = '';
      resultEl.textContent = '';
      startBtn.disabled = true;
      startBtn.textContent = 'ゲーム中…';
      holes.forEach(h => { h.className = 'hole'; });
      lastHole = null;
      showMole();
      countdownTimer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 10) timerLabel.classList.add('warn');
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      running = false;
      clearTimeout(moleTimer);
      clearInterval(countdownTimer);
      holes.forEach(h => h.className = 'hole');
      const msg = score >= 20 ? '🏆 出資承認！' : score >= 12 ? '👍 惜しい！継続審議' : score >= 5 ? '😅 もう一回プレゼンして' : '❌ 出資見送り…';
      resultEl.textContent = `${msg}（${score}点）`;
      startBtn.disabled = false;
      startBtn.textContent = 'もう一度';
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
